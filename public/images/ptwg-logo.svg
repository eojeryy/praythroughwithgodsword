<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ptwgLogoTitle ptwgLogoDesc">
  <title id="ptwgLogoTitle">PTWG logo</title>
  <desc id="ptwgLogoDesc">The PTWG prayer logo featuring a gold cross, open Bible, sword, and spaced-out PTWG wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d4431"/>
      <stop offset="1" stop-color="#072d22"/>
    </linearGradient>
    <linearGradient id="gold" x1="350" y1="40" x2="1050" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d9"/>
      <stop offset="0.2" stop-color="#f5d98b"/>
      <stop offset="0.5" stop-color="#d79c2b"/>
      <stop offset="0.75" stop-color="#a96d12"/>
      <stop offset="1" stop-color="#f8df9a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

